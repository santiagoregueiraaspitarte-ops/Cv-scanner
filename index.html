<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Only the app's own files may load; no network requests can carry resume data elsewhere. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="ResumeLens scores your resume, checks it against a job description and suggests concrete rewrites. Everything runs in your browser.">
  <title>ResumeLens</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1730'/%3E%3Ccircle cx='14' cy='14' r='7' fill='none' stroke='%232f7bff' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='%233ddc97' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="app.skip">Skip to content</a>

  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#/upload" aria-label="ResumeLens home" data-i18n-aria="app.home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="currentColor" opacity=".12"/>
          <circle cx="14" cy="14" r="7" fill="none" stroke="var(--electric)" stroke-width="3"/>
          <path d="M19 19l6 6" stroke="var(--mint)" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>ResumeLens</span>
      </a>
      <nav class="tabs" aria-label="Pages" data-i18n-aria="app.pages">
        <a href="#/upload" data-route="upload" data-i18n="nav.upload">Upload</a>
        <a href="#/report" data-route="report" data-i18n="nav.report">Report</a>
        <a href="#/job" data-route="job" data-i18n="nav.job">Job match</a>
        <a href="#/tips" data-route="tips" data-i18n="nav.tips">Tips</a>
        <a href="#/history" data-route="history" data-i18n="nav.history">History</a>
      </nav>
      <div class="header-tools">
        <div class="lang-switch" role="group" aria-label="Language" data-i18n-aria="app.langGroup">
          <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
          <button type="button" data-lang="es" lang="es" aria-label="Español" aria-pressed="false">ES</button>
        </div>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to dark theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div id="view" class="container"></div>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p class="disclaimer"><strong data-i18n="app.disclaimer">Score is guidance only and not a hiring guarantee.</strong></p>
      <p class="privacy" data-i18n="app.privacy">Runs entirely in your browser. Files never leave your device, and nothing is sent to a server. Job-search links pass only the words you pick, and only when you click one.</p>
    </div>
  </footer>

  <noscript>
    <div class="container"><p class="alert alert-error">ResumeLens needs JavaScript enabled to analyze your resume on this device. · ResumeLens necesita JavaScript activado para analizar tu CV en este dispositivo.</p></div>
  </noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
